<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Area Details - FEDME Foundation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ngoBrown: {
                            50: '#fdfbf7',
                            100: '#f7f0e6',
                            200: '#eddcc5',
                            400: '#d9a752',
                            500: '#c2882b',
                            600: '#a36f1e',
                            700: '#825517',
                            800: '#644114',
                            900: '#472d0d',
                        },
                        ngoBlue: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-ngoBrown-500 selection:text-white">

    <!-- Glowing Background Lights -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center space-x-3 group">
                    <img src="logo.png" alt="FEDME Logo" class="h-14 w-auto object-contain transition-transform duration-300 group-hover:scale-105"/>
                    <div>
                        <span class="block text-[10px] uppercase tracking-widest text-ngoBrown-400 font-extrabold">Foundation for</span>
                        <h1 class="text-xs sm:text-sm font-black text-white tracking-wide">Empowering Digital Marketing & Entrepreneurship</h1>
                    </div>
                </a>

                <nav class="flex items-center">
                    <a href="index.html" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white hover:text-ngoBrown-400 rounded-2xl border border-slate-700 text-xs font-bold transition-all shadow-lg flex items-center gap-2 group">
                        <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i> Back to Home
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full relative z-10">
        
        <!-- Ultra Cool Hero Header Box -->
        <div class="relative bg-gradient-to-r from-slate-800/90 via-slate-800/60 to-slate-800/90 p-8 sm:p-12 rounded-3xl border border-slate-700/80 backdrop-blur-md shadow-2xl mb-16 overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-ngoBrown-500/20 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row items-start md:items-center gap-8 relative z-10">
                <div id="pageIconContainer" class="w-20 h-20 rounded-2xl flex items-center justify-center text-3xl font-black flex-shrink-0 shadow-2xl border border-white/10"></div>
                <div class="space-y-3">
                    <span class="inline-flex items-center gap-2 px-3 py-1 bg-ngoBrown-500/20 text-ngoBrown-400 text-xs font-bold rounded-full border border-ngoBrown-500/30 tracking-widest uppercase">
                        <span class="w-2 h-2 rounded-full bg-ngoBrown-400 animate-pulse"></span>
                        FEDME Statutory Core Focus
                    </span>
                    <h2 id="pageTitle" class="text-3xl sm:text-5xl font-black text-white tracking-tight">Loading...</h2>
                    <p id="pageDescription" class="text-slate-300 text-sm sm:text-base leading-relaxed max-w-3xl font-medium"></p>
                </div>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-10 border-b border-slate-800 pb-4">
            <h3 class="text-xl sm:text-2xl font-black text-white tracking-wide flex items-center gap-3">
                <i class="fa-solid fa-sparkles text-ngoBrown-400"></i> Key Strategic Programs
            </h3>
            <span class="text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 px-3 py-1.5 rounded-full">Explore Impact</span>
        </div>

        <!-- Alternating Modern Cards Container -->
        <div id="objectivesListContainer" class="space-y-12"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 py-10 border-t border-slate-800 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 font-medium">
            &copy; 2026 Foundation for Empowering Digital Marketing and Entrepreneurship (FEDME). All rights reserved.
        </div>
    </footer>

    <script>
        // Official Statutory Objectives with Image and Detailed Description
        const objectivesData = [
            { 
                title: "Poshan Programs", 
                tagline: "Nutritional Security & Child Health",
                desc: "Our Poshan initiative focuses on eradicating malnutrition among infants, growing children, pregnant women, and lactating mothers in rural communities. We distribute nutritionally balanced Poshan kits containing essential proteins, vitamins, and minerals alongside regular growth monitoring and educational workshops on dietary health.", 
                category: "healthcare", 
                icon: "fa-bowl-food",
                image: "poshan.png"
            },
            { 
                title: "Educational & Healthcare Products", 
                tagline: "Essential Supplies Distribution",
                desc: "We bridge critical shortages in educational and medical resources by supplying schools with ergonomic desk-bags, study materials, and smart learning tools. Concurrently, we equip primary health centers and rural families with essential diagnostic devices, hygiene kits, and basic medical support supplies.", 
                category: "healthcare", 
                icon: "fa-medkit",
                image: "eduation.jpg"
            },
            { 
                title: "Medical Help & Medicines", 
                tagline: "Lifesaving Care & Prescription Aid",
                desc: "Providing life-saving medical assistance and prescription medications to economically underprivileged individuals facing acute or chronic health conditions. We partner with pharmaceutical providers and local hospitals to arrange emergency funding and free medicine distribution drives.", 
                category: "healthcare", 
                icon: "fa-kit-medical",
                image: "mmu.jpg"
            },
            { 
                title: "Health & Blood Camps", 
                tagline: "Mobile Health & Screening",
                desc: "Organizing multi-specialty mobile health checkup camps, dental screenings, eye checkups, and voluntary blood donation drives across remote villages. Our mobile medical vans ensure specialized doctors and diagnostic equipment reach families with zero hospital access.", 
                category: "healthcare", 
                icon: "fa-hospital-user",
                image: "medical.jpg"
            },
            { 
                title: "Support Centers & Old Age Homes", 
                tagline: "Elderly Care & Community Support",
                desc: "Creating safe, compassionate, and holistic support centers for senior citizens, destitute elderly, and individuals needing rehabilitation. We offer daily medical care, emotional and psychological counseling, recreational activities, and social inclusion programs.", 
                category: "healthcare", 
                icon: "fa-hands-holding",
                image: "old age.webp"
            },
            { 
                title: "Digital & IT Services", 
                tagline: "Digital Literacy & Smart Skills",
                desc: "Empowering rural youth, students, and aspiring micro-entrepreneurs by teaching digital literacy, computer operation, basic coding, internet navigation, and modern IT tools. We build digital skills to unlock remote working and online business opportunities.", 
                category: "education", 
                icon: "fa-laptop-code",
                image: "smartclass.jpg"
            },
            { 
                title: "Scholarships & Financial Aid", 
                tagline: "Empowering Underprivileged Scholars",
                desc: "Ensuring economic constraints never stop a talented student's education. We offer merit-cum-means scholarships, book grants, uniform subsidies, and school fee coverage to children from lower socio-economic strata.", 
                category: "education", 
                icon: "fa-graduation-cap",
                image: "education-bags.jpeg"
            },
            { 
                title: "Skill Development Training", 
                tagline: "Vocational & Self-Employment Training",
                desc: "Conducting practical vocational training, entrepreneurship development workshops, and skill-gap assessments. We train youth and women in digital marketing, handicrafts, tailored trades, and management skills for self-employment and sustainable livelihoods.", 
                category: "education", 
                icon: "fa-briefcase",
                image: "skill dev.jpg"
            },
            { 
                title: "Environmental Conservation", 
                tagline: "Green Habitats & Water Conservation",
                desc: "Driving mass tree plantation campaigns ('Grow More Plants'), solar energy adoption, rainwater harvesting awareness, and clean water drives ('Save Mother Earth'). We organize community workshops to combat climate change and build eco-friendly green habitats.", 
                category: "environment", 
                icon: "fa-earth-americas",
                image: "evi.webp"
            }
        ];

        const categoryDetails = {
            healthcare: {
                title: "Healthcare & Medical Access",
                desc: "Our healthcare initiatives focus on preventive medicine, mobile dialysis units, safe drinking water, nutritional programs (Poshan), emergency medical assistance, senior citizen care, and health checkup camps for rural communities.",
                iconClass: "bg-ngoBrown-500/20 text-ngoBrown-400 border-ngoBrown-500/30",
                icon: "fa-kit-medical"
            },
            education: {
                title: "Education & Digital Literacy",
                desc: "We bridge educational gaps through scholarships, ergonomic desk-bags, school supplies, smart classrooms, IT training programs, digital marketing skill empowerment, and vocational training for sustainable self-reliance.",
                iconClass: "bg-blue-500/20 text-blue-400 border-blue-500/30",
                icon: "fa-graduation-cap"
            },
            environment: {
                title: "Environment & Community Care",
                desc: "Committed to ecological balance through massive tree plantation drives, water conservation awareness, solar energy adoption, global warming prevention, and community support centers.",
                iconClass: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30",
                icon: "fa-leaf"
            }
        };

        // Read URL Category Parameter
        const urlParams = new URLSearchParams(window.location.search);
        const categoryKey = urlParams.get('cat') || 'healthcare';

        const info = categoryDetails[categoryKey];
        const container = document.getElementById('objectivesListContainer');

        if (info) {
            document.getElementById('pageTitle').innerText = info.title;
            document.getElementById('pageDescription').innerText = info.desc;

            const iconBox = document.getElementById('pageIconContainer');
            iconBox.className = `w-20 h-20 rounded-2xl flex items-center justify-center text-3xl font-bold flex-shrink-0 ${info.iconClass}`;
            iconBox.innerHTML = `<i class="fa-solid ${info.icon}"></i>`;

            // Filter Matching Objectives
            const filtered = objectivesData.filter(item => item.category === categoryKey);

            container.innerHTML = '';

            filtered.forEach((obj, index) => {
                const isEven = index % 2 === 0; // Alternating layout flag
                
                const card = document.createElement('div');
                card.className = "group bg-slate-800/50 hover:bg-slate-800/90 rounded-3xl border border-slate-700/60 hover:border-ngoBrown-500/50 p-6 sm:p-10 transition-all duration-500 shadow-xl relative overflow-hidden backdrop-blur-sm";

                // Alternating Grid Order
                const textOrderClass = isEven ? "order-1" : "order-1 lg:order-2";
                const imageOrderClass = isEven ? "order-2" : "order-2 lg:order-1";

                card.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
                        
                        <!-- Text Content Block -->
                        <div class="lg:col-span-7 space-y-4 ${textOrderClass}">
                            <div class="inline-flex items-center gap-2 px-3 py-1 bg-slate-700/60 rounded-full border border-slate-600/50 text-ngoBrown-400 text-xs font-bold">
                                <i class="fa-solid ${obj.icon}"></i>
                                <span>${obj.tagline}</span>
                            </div>
                            
                            <h4 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight group-hover:text-ngoBrown-400 transition-colors">${obj.title}</h4>
                            
                            <p class="text-slate-300 text-sm sm:text-base leading-relaxed font-normal">
                                ${obj.desc}
                            </p>

                            <div class="pt-3 flex items-center text-xs font-bold text-slate-400 gap-2">
                                <i class="fa-solid fa-circle-check text-ngoBrown-400"></i> FEDME Certified Community Action Program
                            </div>
                        </div>

                        <!-- Image Block without Text Overlay -->
                        <div class="lg:col-span-5 ${imageOrderClass}">
                            <div class="relative group/img rounded-2xl overflow-hidden border border-slate-700/80 shadow-2xl h-64 sm:h-72 w-full bg-slate-900">
                                <img 
                                    src="${obj.image}" 
                                    alt="${obj.title}" 
                                    class="w-full h-full object-cover group-hover/img:scale-105 transition-transform duration-700 opacity-90 group-hover/img:opacity-100"
                                    onerror="this.onerror=null; this.src='hero.png';"
                                />
                            </div>
                        </div>

                    </div>
                `;
                container.appendChild(card);
            });
        } else {
            document.getElementById('pageTitle').innerText = "Category Not Found";
            document.getElementById('pageDescription').innerText = "Please go back to the homepage and select a valid category.";
        }
    </script>
</body>
</html>
